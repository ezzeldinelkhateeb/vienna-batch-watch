name: Automated Expiry Check & Alerts

on:
  schedule:
    # Runs daily at 06:00 UTC (09:00 AM Cairo/Riyadh time)
    - cron: '0 6 * * *'
    # Runs daily at 12:00 UTC (03:00 PM Cairo/Riyadh time)
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  check-expiry:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Expiry Check Webhook
        run: |
          echo "Triggering Vienna Batch Watch Expiry Check..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "https://vienna-batch-watch.vercel.app/api/public/hooks/expiry-check" \
            -H "Content-Type: application/json" \
            -H "User-Agent: GitHub-Actions-Vienna-Expiry-Cron")
          echo "$RESPONSE"
